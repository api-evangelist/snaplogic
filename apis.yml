  description: SnapLogic API Management enables organizations to create, manage, secure, and monitor APIs throughout their lifecycle. It supports
    exposing SnapLogic pipelines as APIs or creating APIs from an OpenAPI specification, applying security policies, managing versions, publishing
    to a customizable developer portal, and monitoring API metrics and performance across on-premises, hybrid, and cloud environments.
- aid: snaplogic:snaplogic-snap-development
  name: SnapLogic Snap Development SDK
  tags:
  - Development
  - Integration
  - SDK
  humanURL: https://developer.snaplogic.com/
  properties:
  - url: https://developer.snaplogic.com/
    type: Documentation
  - url: https://github.com/SnapLogic/developer.snaplogic.com
    type: GitHubOrganization
  description: The SnapLogic Snap Development SDK provides a Java-based framework for building custom Snaps for the SnapLogic Intelligent Integration
    Platform. Snaps are streaming data processors that consume and produce Binary or Document data through input and output views. The SDK supports
    property configuration, expression language, binary and document data handling, input schema validation, error view handling, and unit testing.
- aid: snaplogic:snaplogic
  name: SnapLogic
  tags: []
  humanURL: https://www.snaplogic.com/
  properties:
  - url: ' https://www.snaplogic.com/'
    type: Documentation
  description: SnapLogic provides an AI-powered, all-in-one generative integration platform that unifies data across on-premises, hybrid, and
    cloud environments. It streamlines complex workflows, enabling rapid development, deployment, and management of integrations. Users can build
    pipelines visually, leverage pre-built connectors, and extend functionality with custom Snaps. The platform supports real-time data processing,
    batch integration, and API management, delivering scalable, secure, and observable solutions for enterprises seeking to accelerate digital
    transformation.
